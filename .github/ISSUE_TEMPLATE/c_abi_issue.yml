name: C ABI issue
description: Report a problem specific to the generated C/C++ ABI
title: "c-abi: "
labels: [c-abi]
body:
  - type: input
    id: header
    attributes:
      label: Header and library version
      description: Include header commit/version and dynamic/static library artifact.
      placeholder: "include/fjiffyldg.h from commit SHA, target/release/fjiffyldg.dll"
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: C/C++ compiler and platform
      placeholder: "gcc 14 on Linux x86_64 / MSVC on Windows x64"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Build or link command
      render: shell
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal C/C++ sample
      render: c
  - type: textarea
    id: logs
    attributes:
      label: Error output or runtime behavior
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks performed
      options:
        - label: I ran `pwsh -File scripts/generate_c_header.ps1 -Verify`.
        - label: I ran `pwsh -File scripts/check_c_abi.ps1`.
        - label: I checked the C API usage guide.
