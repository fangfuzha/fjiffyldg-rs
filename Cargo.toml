[package]
name = "fjiffyldg"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["fangfuzha"]
description = "High-performance cross-platform file processing library"
license = "BSD-3-Clause OR MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/fangfuzha/fjiffyldg-rs"
homepage = "https://github.com/fangfuzha/fjiffyldg-rs"
documentation = "https://docs.rs/fjiffyldg"
keywords = ["file", "mmap", "large-file", "encoding", "ffi"]
categories = ["filesystem", "encoding", "api-bindings"]
exclude = ["target/**", "reference/**", ".github/**"]

[lib]
name = "fjiffyldg"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
memmap2 = "0.9"
encoding_rs = "0.8"
thiserror = "1.0"
parking_lot = "0.12"
rayon = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"

[[bench]]
name = "large_file"
harness = false

[package.metadata.docs.rs]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
