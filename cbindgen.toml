language = "C"
cpp_compat = true
include_guard = "FJIFFYLDG_H"
autogen_warning = "/* Generated by cbindgen. Do not edit manually. */"
include_version = true
style = "both"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"
sys_includes = ["stdint.h"]
after_includes = """
#ifdef FJIFFYLDG_SHARED
#if defined(_WIN32) || defined(__CYGWIN__)
#if defined(BUILDING_FJIFFYLDG)
#define FJIFFYLDG_API __declspec(dllexport)
#else
#define FJIFFYLDG_API __declspec(dllimport)
#endif
#elif defined(__GNUC__) || defined(__clang__)
#define FJIFFYLDG_API __attribute__((visibility(\"default\")))
#else
#define FJIFFYLDG_API
#endif
#else
#define FJIFFYLDG_API
#endif

/** UTF encoding mode for RestartScanFile. */
enum FjiffyldgUtfMode {
    FJIFFYLDG_UTF_DEFAULT    =  0,
    FJIFFYLDG_UTF16_LE       =  1,
    FJIFFYLDG_UTF16_BE       =  2,
    FJIFFYLDG_UTF32_LE       =  3,
    FJIFFYLDG_UTF32_BE       =  4,
    FJIFFYLDG_UTF_AUTO       = -1
};
"""
trailer = """
#ifdef __cplusplus
#ifndef FJIFFYLDG_CPP_WRAPPER_H
#define FJIFFYLDG_CPP_WRAPPER_H
namespace Fjiffyldg {
class Fjiffyldg {
public:
    Fjiffyldg() : handle_(fjiffyldg_create()) {}

    Fjiffyldg(Fjiffyldg &&other) noexcept : handle_(other.handle_) { other.handle_ = nullptr; }

    Fjiffyldg &operator=(Fjiffyldg &&other) noexcept {
        if (this != &other) {
            fjiffyldg_clear(handle_);
            handle_ = other.handle_;
            other.handle_ = nullptr;
        }
        return *this;
    }

    Fjiffyldg(const Fjiffyldg &) = delete;
    Fjiffyldg &operator=(const Fjiffyldg &) = delete;

    ~Fjiffyldg() { fjiffyldg_clear(handle_); }

    fjiffyldg_ptr GetFjiffyldgHandle() { return handle_; }

private:
    fjiffyldg_ptr handle_;
};
}
#endif
#endif
"""

[parse]
include = ["ffi", "error"]

[export]
include = ["fjiffyldg_t", "fjiffyldg_ptr"]
item_types = ["opaque", "typedefs", "functions", "enums"]

[fn]
prefix = "FJIFFYLDG_API"
